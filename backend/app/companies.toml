# Lista curada de empresas-alvo. É ela que define o "só empresa grande":
# o coletor nunca busca fora daqui.
#
# category: big_tech | bank | fintech | multinational
#
# Como achar o ATS de uma empresa: abra a página de vagas dela e olhe a URL.
#   boards.greenhouse.io/<id> ou job-boards.greenhouse.io/<id>  -> greenhouse
#   jobs.lever.co/<id>                                          -> lever
#   jobs.ashbyhq.com/<id>                                       -> ashby
#   jobs.smartrecruiters.com/<id>                               -> smartrecruiters
#   <tenant>.<wdN>.myworkdayjobs.com/<site>                     -> workday
#   <empresa>.gupy.io                                           -> gupy (match = nome/subdomínio)
#   página com "Powered by Eightfold" (ex.: /careers?domain=...)   -> eightfold (id = domínio, host = site)
#
# Para adicionar uma empresa, copie um bloco [[companies]] e ajuste.
# Rode `python scripts/check_sources.py` para validar todas as fontes.
# Empresas da Gupy que não tiverem vaga aberta simplesmente não aparecem.


